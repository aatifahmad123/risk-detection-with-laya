<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laya Banking Fraud Risk Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Laya Banking Fraud Risk Engine</h1>
      <p class="sub">Structured fraud-risk decisions from banking customer-agent calls.</p>
    </header>

    <div class="layout">
      <section>
        <h2>Input</h2>

        <label for="sample">Synthetic call</label>
        <div class="row">
          <select id="sample"></select>
          <button type="button" id="load">Load sample</button>
        </div>

        <label for="transcript">Call transcript</label>
        <textarea id="transcript" rows="20" placeholder="Paste a customer-agent banking call here..."></textarea>

        <div class="row action-row">
          <button type="button" id="analyze">Analyze with Laya</button>
          <span id="status" class="status" hidden></span>
        </div>
      </section>

      <section>
        <h2>Assessment</h2>
        <p id="empty" class="sub">No analysis yet.</p>

        <div id="result" hidden>
          <table id="decisions"></table>

          <h3>Fraud category distribution</h3>
          <ul id="fraud-dist" class="dist"></ul>

          <h3>Risk level distribution</h3>
          <ul id="risk-dist" class="dist"></ul>
        </div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function setStatus(text, isError = false) {
      const el = $("status");
      el.hidden = !text;
      el.textContent = text;
      el.classList.toggle("error", isError);
    }

    function addRow(table, name, value) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = name;
      const td = document.createElement("td");
      td.textContent = value;
      tr.append(th, td);
      table.appendChild(tr);
    }

    function renderDist(el, entries) {
      el.replaceChildren();
      for (const e of entries) {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = e.label;
        const value = document.createElement("span");
        value.textContent = (e.value * 100).toFixed(1) + "%";
        li.append(label, value);
        el.appendChild(li);
      }
    }

    function render(data) {
      const s = data.summary;
      $("decisions").replaceChildren();
      addRow($("decisions"), "Fraud category", s.fraud_category);
      addRow($("decisions"), "Risk level", s.risk_label + " (score " + s.risk_score + ")");
      addRow($("decisions"), "OTP / verification code", s.otp + " (" + s.otp_prob + ")");
      addRow($("decisions"), "Unauthorized transaction", s.unauthorized_transaction + " (" + s.unauthorized_transaction_prob + ")");
      addRow($("decisions"), "Social engineering", s.social_engineering + " (" + s.social_engineering_prob + ")");
      addRow($("decisions"), "Recommended action", s.escalate ? "ESCALATE" : "MONITOR");

      renderDist($("fraud-dist"), s.fraud_distribution);
      renderDist($("risk-dist"), s.risk_distribution);
    }

    async function loadSamples() {
      try {
        const res = await fetch("/api/samples");
        const samples = await res.json();
        $("sample").replaceChildren(...samples.map((s) => {
          const opt = document.createElement("option");
          opt.value = s.index;
          opt.textContent = s.title;
          return opt;
        }));
      } catch (e) {
        setStatus("Could not load samples: " + e.message, true);
      }
    }

    $("load").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/samples/" + $("sample").value);
        if (!res.ok) throw new Error("Sample not found");
        const data = await res.json();
        $("transcript").value = data.transcript;
        setStatus("");
      } catch (e) {
        setStatus("Error: " + e.message, true);
      }
    });

    $("analyze").addEventListener("click", async () => {
      $("analyze").disabled = true;
      setStatus("Analyzing — the first run loads the model and can take a while…");
      try {
        const res = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ transcript: $("transcript").value }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Analysis failed");
        $("empty").hidden = true;
        $("result").hidden = false;
        render(data);
        setStatus("");
      } catch (e) {
        setStatus("Error: " + e.message, true);
      } finally {
        $("analyze").disabled = false;
      }
    });

    loadSamples();
  </script>
</body>
</html>
